<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>心智理论实验</title>
  <style>
    :root{font-family:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;color:#263344;background:#fff;color-scheme:light;font-size:16px;line-height:1.65}
    *{box-sizing:border-box}body{margin:0}a{color:inherit}main,header{max-width:1120px;margin:0 auto;padding-inline:28px}
    .home-header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:25px;border-bottom:1px solid #dfe5ed}
    .header-label{font-size:12px;letter-spacing:.06em;color:#68778b}
    .intro{padding-top:72px;max-width:850px}.eyebrow{font-size:12px;letter-spacing:.13em;color:#68778b;margin:0 0 13px}
    h1{margin:0;font-size:clamp(28px,4.3vw,44px);font-weight:500;line-height:1.3;letter-spacing:-.02em}
    .intro p:last-child{margin:19px 0 0;font-size:16px;color:#647285;max-width:650px}
    .experiments{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:45px;padding-bottom:65px}
    .experiment{display:flex;flex-direction:column;text-decoration:none;border:1px solid #dbe3ed;border-radius:12px;padding:28px;min-height:310px;transition:border-color .15s,background-color .15s,transform .15s;background:#fff}
    .experiment:hover{border-color:#8facce;background:#fbfdff;transform:translateY(-2px)}.experiment:focus-visible{outline:2px solid #397ebd;outline-offset:4px}
    .experiment-type{font-size:11px;letter-spacing:.13em;color:#68778b}.experiment h2{font-size:25px;font-weight:500;line-height:1.4;margin:25px 0 9px}
    .description{margin:0;color:#5d6c7f;font-size:14px;max-width:355px}.meta{font-size:12px;color:#728095;margin:19px 0 0}
    .enter{margin-top:auto;padding-top:28px;font-size:14px;font-weight:500;color:#2d628e;display:flex;justify-content:space-between;align-items:center;gap:15px}
    .experiment-decoration{display:flex;gap:8px;margin-top:22px;min-height:39px;align-items:center}
    .hand{font-family:Consolas,monospace;display:inline-flex;align-items:center;justify-content:center;min-width:48px;height:38px;border:1px solid #dce5ef;border-radius:5px;background:#f8fbff;color:#3d5d7e;font-size:16px}
    .birthday-decoration{color:#3d5d7e;font-size:15px;letter-spacing:.08em}.birthday-decoration span{border-bottom:1px solid #c8d6e6;padding-bottom:5px;margin-right:5px}
    @media(max-width:700px){main,header{padding-inline:20px}.intro{padding-top:43px}.experiments{grid-template-columns:1fr;margin-top:30px;gap:17px}.experiment{min-height:280px;padding:24px}.experiment h2{margin-top:18px}.home-header{padding-block:20px}}
    @media(max-width:380px){main,header{padding-inline:16px}.header-label{font-size:11px}.intro p:last-child{font-size:14px}.experiment{padding:22px}}
    @media(prefers-reduced-motion:reduce){.experiment{transition:none}.experiment:hover{transform:none}}
  </style>
</head>
<body>
  <header class="home-header"><span class="header-label">ToM Experiments</span></header>
  <main>
    <section class="intro" aria-labelledby="home-title">
      <p class="eyebrow">THEORY OF MIND · EXPERIMENTS</p>
      <h1>心智理论实验</h1>
      <p>选择一个实验，逐步查看公开宣告后的可能世界、候选情况与各阶回答。</p>
    </section>
    <nav class="experiments" aria-label="选择实验">
      <a class="experiment" href="cards.html" id="cards-entry">
        <span class="experiment-type">ACES &amp; EIGHTS</span>
        <div class="experiment-decoration" aria-hidden="true"><span class="hand">AA</span><span class="hand">A8</span><span class="hand">88</span></div>
        <h2>纸牌实验</h2>
        <p class="description">结合他人的手牌与公开宣告，观察不同阶数的玩家如何推理自己的牌面。</p>
        <p class="meta">19 种牌面 · 3 种宣告顺序</p>
        <span class="enter">进入纸牌实验 <span aria-hidden="true">→</span></span>
      </a>
      <a class="experiment" href="birthday.html" id="birthday-entry">
        <span class="experiment-type">CHERYL'S BIRTHDAY</span>
        <div class="experiment-decoration birthday-decoration" aria-hidden="true"><span>月份</span><span>日期</span><span>生日</span></div>
        <h2>生日实验</h2>
        <p class="description">结合月份、日期与对话，观察不同阶数的主体如何推理 Cheryl 的生日。</p>
        <p class="meta">一至四阶 · 4 种日期配置</p>
        <span class="enter">进入生日实验 <span aria-hidden="true">→</span></span>
      </a>
    </nav>
  </main>
</body>
</html>
